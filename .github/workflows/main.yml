name: Build SignalDeep APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true
      - name: Install Gradle 8.7
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          sudo mv gradle-8.7 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Setup Gradle repositories
        run: |
          set -e
          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SignalDeep"
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.5.0' apply false }
          EOF

      - name: Create project files
        run: |
          set -e
          # 🚨 پاک کردن کامل پوشه‌های قدیمی جاوا و منابع (res) برای جلوگیری از تداخل 🚨
          rm -rf app/src/main/java
          rm -rf app/src/main/res
          
          mkdir -p app/src/main/java/com/example/signaldeep
          mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable

          cat > .gitignore << 'EOF'
          build/
          .gradle/
          app/build/
          local.properties
          *.apk
          *.iml
          .idea/
          gradle/wrapper/gradle-wrapper.jar
          gradlew
          gradlew.bat
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.signaldeep'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.signaldeep"
                  minSdk 26
                  targetSdk 34
                  versionCode 13
                  versionName "3.2"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
              <application
                  android:name=".SignalDeepApp"
                  android:allowBackup="true"
                  android:label="SignalDeep"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity android:name=".OnboardingActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".MainActivity" android:exported="false" />
              </application>
          </manifest>
          EOF

