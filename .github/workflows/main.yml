name: Build SignalDeep APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          yes | sdkmanager --licenses || true
      - name: Install Gradle 8.7
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          sudo mv gradle-8.7 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Setup Gradle repositories
        run: |
          set -e
          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SignalDeep"
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.5.0' apply false }
          EOF

      - name: Create project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/signaldeep
          mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable
          mkdir -p app/src/main/cpp

          cat > .gitignore << 'EOF'
          build/
          .gradle/
          app/build/
          local.properties
          *.apk
          *.iml
          .idea/
          gradle/wrapper/gradle-wrapper.jar
          gradlew
          gradlew.bat
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.signaldeep'
              compileSdk 34
              ndkVersion "26.1.10909125"
              defaultConfig {
                  applicationId "com.example.signaldeep"
                  minSdk 26
                  targetSdk 34
                  versionCode 6
                  versionName "2.2"
                  externalNativeBuild { cmake { cppFlags "-std=c++17" } }
                  ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
              }
              externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("signaldeep")
          add_library(native-lib SHARED native-lib.cpp)
          find_library(log-lib log)
          target_link_libraries(native-lib ${log-lib})
          EOF

          cat > app/src/main/cpp/native-lib.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include <cmath>
          #include <android/log.h>
          #define LOG_TAG "SignalNative"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)
          static double clamp01(double v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
          extern "C" JNIEXPORT jstring JNICALL
          Java_com_example_signaldeep_MainActivity_stringFromNative(JNIEnv* env, jobject) {
              return env->NewStringUTF("Native layer active (C++17)");
          }
          extern "C" JNIEXPORT jint JNICALL
          Java_com_example_signaldeep_MainActivity_nativeLteScore(
                  JNIEnv*, jobject, jint rsrp, jint rsrq, jint sinr, jint cqi) {
              double qR = clamp01((rsrp + 130.0) / 50.0);
              double qQ = clamp01((rsrq + 20.0)  / 10.0);
              double qS = clamp01( sinr        / 20.0);
              double qC = (cqi >= 0) ? clamp01(cqi / 15.0) : 0.0;
              return (jint)std::lround(100.0 * (0.35*qR + 0.25*qQ + 0.25*qS + 0.15*qC));
          }
          EOF

