      - name: Verify all files present
        run: |
          set -e
          for f in \
            settings.gradle build.gradle gradle.properties .gitignore \
            app/build.gradle app/src/main/AndroidManifest.xml \
            app/src/main/res/values/strings.xml \
            app/src/main/res/values/colors.xml \
            app/src/main/res/drawable/card_bg.xml \
            app/src/main/res/layout/activity_onboarding.xml \
            app/src/main/res/layout/activity_main.xml \
            app/src/main/java/com/example/signaldeep/SignalLogger.java \
            app/src/main/java/com/example/signaldeep/SignalDeepApp.java \
            app/src/main/java/com/example/signaldeep/SignalInterpreter.java \
            app/src/main/java/com/example/signaldeep/BarChartView.java \
            app/src/main/java/com/example/signaldeep/OnboardingActivity.java \
            app/src/main/java/com/example/signaldeep/MainActivity.java \
            app/src/main/cpp/CMakeLists.txt app/src/main/cpp/native-lib.cpp ; do
            [ -f "$f" ] && echo "OK: $f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signal-deep-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and push generated files to repo
        if: success() && github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SignalDeep Bot"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "chore: auto-generate project files [skip ci]"
            git push
          fi
