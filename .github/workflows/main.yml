name: Build SignalDeep APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          yes | sdkmanager --licenses || true

      - name: Install Gradle 8.7
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          sudo mv gradle-8.7 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Setup Gradle repositories
        run: |
          set -e
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SignalDeep"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

      - name: Create project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/signaldeep
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/cpp

          cat > .gitignore << 'EOF'
          build/
          .gradle/
          app/build/
          local.properties
          *.apk
          *.iml
          .idea/
          gradle/wrapper/gradle-wrapper.jar
          gradlew
          gradlew.bat
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.signaldeep'
              compileSdk 34
              ndkVersion "26.1.10909125"
              defaultConfig {
                  applicationId "com.example.signaldeep"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17"
                      }
                  }
                  ndk {
                      abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                  }
              }
              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("signaldeep")
          add_library(native-lib SHARED native-lib.cpp)
          find_library(log-lib log)
          target_link_libraries(native-lib ${log-lib})
          EOF

          cat > app/src/main/cpp/native-lib.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include <cmath>
          #include <android/log.h>

          #define LOG_TAG "SignalNative"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          static double clamp01(double v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_example_signaldeep_MainActivity_stringFromNative(
                  JNIEnv* env, jobject) {
              return env->NewStringUTF("Native layer active (C++17)");
          }

          extern "C" JNIEXPORT jint JNICALL
          Java_com_example_signaldeep_MainActivity_nativeLteScore(
                  JNIEnv*, jobject, jint rsrp, jint rsrq, jint sinr) {
              double qR = clamp01((rsrp + 130.0) / 50.0);
              double qQ = clamp01((rsrq + 20.0)  / 10.0);
              double qS = clamp01( sinr        / 20.0);
              return (jint)std::lround(100.0 * (0.4*qR + 0.3*qQ + 0.3*qS));
          }

          extern "C" JNIEXPORT jint JNICALL
          Java_com_example_signaldeep_MainActivity_nativeWcdmaScore(
                  JNIEnv*, jobject, jint dbm, jint ecno) {
              double qP = clamp01((dbm  + 110.0) / 40.0);
              double qE = clamp01((ecno + 12.0)  / 8.0);
              return (jint)std::lround(100.0 * (0.6*qP + 0.4*qE));
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS"
                  tools:ignore="ProtectedPermissions" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".CorrelationActivity" android:exported="false" />
                  <service android:name=".SignalSamplingService" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">SignalDeep</string>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical" android:padding="12dp"
              android:layout_width="match_parent" android:layout_height="match_parent">
              <Button android:id="@+id/btn_perms" android:text="Grant Permissions"
                  android:layout_width="match_parent" android:layout_height="wrap_content" />
              <Button android:id="@+id/btn_usage" android:text="Grant Usage Access"
                  android:layout_width="match_parent" android:layout_height="wrap_content" />
              <Button android:id="@+id/btn_start" android:text="Start Sampling"
                  android:layout_width="match_parent" android:layout_height="wrap_content" />
              <Button android:id="@+id/btn_stop" android:text="Stop Sampling"
                  android:layout_width="match_parent" android:layout_height="wrap_content" />
              <Button android:id="@+id/btn_history" android:text="View History"
                  android:layout_width="match_parent" android:layout_height="wrap_content" />
              <ScrollView android:layout_width="match_parent" android:layout_height="0dp"
                  android:layout_weight="1" android:layout_marginTop="8dp">
                  <TextView android:id="@+id/tv_signal" android:textSize="13sp"
                      android:fontFamily="monospace"
                      android:layout_width="match_parent" android:layout_height="wrap_content" />
              </ScrollView>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_correlation.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical" android:padding="8dp"
              android:layout_width="match_parent" android:layout_height="match_parent">
              <ListView android:id="@+id/list" android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/example/signaldeep/SignalInterpreter.java << 'EOF'
          package com.example.signaldeep;

          public class SignalInterpreter {
              public static String lteRsrpGrade(int v) {
                  if (v >= -80) return "EXCELLENT (4/4)";
                  if (v >= -90) return "GOOD (3/4)";
                  if (v >= -100) return "FAIR (2/4)";
                  if (v >= -110) return "POOR (1/4)";
                  if (v >= -120) return "VERY POOR (0/4)";
                  return "NO SIGNAL";
              }
              public static String lteRsrqGrade(int v) {
                  if (v >= -10) return "EXCELLENT";
                  if (v >= -15) return "GOOD";
                  if (v >= -20) return "FAIR";
                  return "POOR";
              }
              public static String lteSinrGrade(int v) {
                  if (v >= 20) return "EXCELLENT";
                  if (v >= 13) return "GOOD";
                  if (v >= 0)  return "FAIR";
                  return "POOR";
              }
              public static String wcdmaDbmGrade(int v) {
                  if (v >= -70)  return "EXCELLENT (4/4)";
                  if (v >= -85)  return "GOOD (3/4)";
                  if (v >= -100) return "FAIR (2/4)";
                  if (v >= -110) return "POOR (1/4)";
                  return "NO SIGNAL";
              }
              public static String wcdmaEcnoGrade(int v) {
                  if (v >= -4)  return "EXCELLENT";
                  if (v >= -8)  return "GOOD";
                  if (v >= -12) return "FAIR";
                  return "POOR";
              }
              public static String gsmDbmGrade(int v) {
                  if (v >= -75)  return "EXCELLENT (4/4)";
                  if (v >= -85)  return "GOOD (3/4)";
                  if (v >= -95)  return "FAIR (2/4)";
                  if (v >= -105) return "POOR (1/4)";
                  return "NO SIGNAL";
              }
              public static String scoreToGrade(int s) {
                  if (s >= 85) return "EXCELLENT";
                  if (s >= 65) return "GOOD";
                  if (s >= 40) return "FAIR";
                  if (s >= 20) return "POOR";
                  return "VERY POOR";
              }
              public static String bars(int level) {
                  switch (level) {
                      case 0: return "[    ]";
                      case 1: return "[|   ]";
                      case 2: return "[||  ]";
                      case 3: return "[||| ]";
                      case 4: return "[||||]";
                      default: return "[????]";
                  }
              }
              public static String networkName(int type) {
                  switch (type) {
                      case 1: return "GPRS (2G)";
                      case 2: return "EDGE (2G)";
                      case 3: return "UMTS (3G)";
                      case 4: return "CDMA (2G)";
                      case 5: return "EVDO_0 (3G)";
                      case 6: return "EVDO_A (3G)";
                      case 7: return "1xRTT (2G)";
                      case 8: return "HSDPA (3G)";
                      case 9: return "HSUPA (3G)";
                      case 10: return "HSPA (3G)";
                      case 11: return "iDEN (2G)";
                      case 12: return "EVDO_B (3G)";
                      case 13: return "LTE (4G)";
                      case 14: return "eHRPD (3G)";
                      case 15: return "HSPAP (3G)";
                      case 16: return "GSM (2G)";
                      case 17: return "TD-SCDMA (3G)";
                      case 18: return "IWLAN";
                      case 19: return "LTE-CA (4G+)";
                      default: return "UNKNOWN (" + type + ")";
                  }
              }
              public static boolean isLte(int t)  { return t == 13 || t == 19; }
              public static boolean isWcdma(int t) {
                  return t == 3 || t == 5 || t == 6 || t == 8 || t == 9 ||
                         t == 10 || t == 12 || t == 14 || t == 15 || t == 17;
              }
              public static boolean isGsm(int t) {
                  return t == 1 || t == 2 || t == 4 || t == 7 || t == 11 || t == 16;
              }
          }
          EOF

          cat > app/src/main/java/com/example/signaldeep/SignalSample.java << 'EOF'
          package com.example.signaldeep;

          public class SignalSample {
              public long timestamp;
              public String networkType;
              public int level;
              public int power;
              public int quality;
              public int sinr;
              public int cellId;
              public int pci;
              public int areaCode;
              public int freqCode;
              public int mcc, mnc;
              public int score;
              public String grade;
              public String fgApp;
              public int wifiRssi;
              public String wifiSsid;
          }
          EOF

          cat > app/src/main/java/com/example/signaldeep/DatabaseHelper.java << 'EOF'
          package com.example.signaldeep;

          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.database.sqlite.SQLiteDatabase;
          import android.database.sqlite.SQLiteOpenHelper;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class DatabaseHelper extends SQLiteOpenHelper {
              public DatabaseHelper(Context c) { super(c, "signal.db", null, 2); }

              @Override public void onCreate(SQLiteDatabase db) {
                  db.execSQL("CREATE TABLE samples (" +
                      "id INTEGER PRIMARY KEY AUTOINCREMENT, ts INTEGER, net TEXT, " +
                      "lvl INTEGER, pw INTEGER, q INTEGER, sinr INTEGER, " +
                      "cid INTEGER, pci INTEGER, area INTEGER, freq INTEGER, " +
                      "mcc INTEGER, mnc INTEGER, score INTEGER, grade TEXT, " +
                      "fg TEXT, wrssi INTEGER, wssid TEXT)");
              }
              @Override public void onUpgrade(SQLiteDatabase db, int o, int n) {
                  db.execSQL("DROP TABLE IF EXISTS samples"); onCreate(db);
              }
              public void insert(SignalSample s) {
                  SQLiteDatabase db = getWritableDatabase();
                  ContentValues v = new ContentValues();
                  v.put("ts", s.timestamp); v.put("net", s.networkType);
                  v.put("lvl", s.level); v.put("pw", s.power);
                  v.put("q", s.quality); v.put("sinr", s.sinr);
                  v.put("cid", s.cellId); v.put("pci", s.pci);
                  v.put("area", s.areaCode); v.put("freq", s.freqCode);
                  v.put("mcc", s.mcc); v.put("mnc", s.mnc);
                  v.put("score", s.score); v.put("grade", s.grade);
                  v.put("fg", s.fgApp);
                  v.put("wrssi", s.wifiRssi); v.put("wssid", s.wifiSsid);
                  db.insert("samples", null, v); db.close();
              }
              public List<String> getRecent(int n) {
                  List<String> out = new ArrayList<>();
                  SQLiteDatabase db = getReadableDatabase();
                  Cursor c = db.rawQuery(
                      "SELECT ts,net,lvl,pw,q,sinr,cid,pci,area,freq,score,grade,fg,wrssi " +
                      "FROM samples ORDER BY ts DESC LIMIT " + n, null);
                  SimpleDateFormat f = new SimpleDateFormat("HH:mm:ss", Locale.US);
                  while (c.moveToNext()) {
                      StringBuilder sb = new StringBuilder();
                      sb.append(f.format(new Date(c.getLong(0)))).append("  ");
                      sb.append(c.getString(1)).append("  ");
                      sb.append(SignalInterpreter.bars(c.getInt(2))).append("\n");
                      sb.append("   Power=").append(c.getInt(3)).append("dBm  ");
                      sb.append("Quality=").append(c.getInt(4)).append("  ");
                      sb.append("SINR=").append(c.getInt(5)).append("\n");
                      sb.append("   Cell=").append(c.getInt(6)).append("  ");
                      sb.append("PCI/PSC=").append(c.getInt(7)).append("  ");
                      sb.append("TAC/LAC=").append(c.getInt(8)).append("  ");
                      sb.append("Freq=").append(c.getInt(9)).append("\n");
                      sb.append("   SCORE=").append(c.getInt(10)).append("/100  ");
                      sb.append(c.getString(11)).append("\n");
                      String fg = c.getString(12);
                      if (fg != null && !fg.isEmpty()) sb.append("   FG App: ").append(fg).append("\n");
                      int wr = c.getInt(13);
                      if (wr != 0) sb.append("   WiFi: ").append(wr).append("dBm\n");
                      out.add(sb.toString());
                  }
                  c.close(); db.close(); return out;
              }
          }
          EOF

          cat > app/src/main/java/com/example/signaldeep/SignalSamplingService.java << 'EOF'
          package com.example.signaldeep;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.app.usage.UsageStats;
          import android.app.usage.UsageStatsManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.wifi.WifiInfo;
          import android.net.wifi.WifiManager;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.telephony.CellIdentityGsm;
          import android.telephony.CellIdentityLte;
          import android.telephony.CellIdentityWcdma;
          import android.telephony.CellInfo;
          import android.telephony.CellInfoGsm;
          import android.telephony.CellInfoLte;
          import android.telephony.CellInfoWcdma;
          import android.telephony.CellSignalStrengthGsm;
          import android.telephony.CellSignalStrengthLte;
          import android.telephony.CellSignalStrengthWcdma;
          import android.telephony.SignalStrength;
          import android.telephony.TelephonyManager;
          import android.util.Log;
          import androidx.core.app.NotificationCompat;
          import java.util.List;

          public class SignalSamplingService extends Service {
              private static final String CH = "signal_ch";
              private static final String TAG = "SignalSampling";
              private Handler h;
              private Runnable r;
              private TelephonyManager tm;
              private WifiManager wm;
              private DatabaseHelper db;
              private UsageStatsManager usm;
              private MainActivity nat;

              @Override public void onCreate() {
                  super.onCreate();
                  tm = (TelephonyManager) getSystemService(Context.TELEPHONY_SERVICE);
                  wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                  usm = (UsageStatsManager) getSystemService(Context.USAGE_STATS_SERVICE);
                  db = new DatabaseHelper(this);

                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  NotificationChannel ch = new NotificationChannel(CH, "Signal Sampling", NotificationManager.IMPORTANCE_LOW);
                  nm.createNotificationChannel(ch);
                  Notification n = new NotificationCompat.Builder(this, CH)
                      .setContentTitle("SignalDeep Sampling")
                      .setContentText("Collecting signal data every 5s...")
                      .setSmallIcon(android.R.drawable.ic_menu_info_details)
                      .build();
                  startForeground(1, n);

                  h = new Handler(Looper.getMainLooper());
                  r = new Runnable() {
                      @Override public void run() {
                          try { sample(); } catch (Exception e) { Log.w(TAG, "sample", e); }
                          h.postDelayed(this, 5000);
                      }
                  };
                  h.post(r);
              }

              private void sample() {
                  SignalSample s = new SignalSample();
                  s.timestamp = System.currentTimeMillis();

                  int dataType = 0;
                  try {
                      if (checkSelfPermission(android.Manifest.permission.READ_PHONE_STATE)
                              == PackageManager.PERMISSION_GRANTED) {
                          dataType = tm.getDataNetworkType();
                      }
                  } catch (Exception e) { Log.w(TAG, "type", e); }

                  s.networkType = SignalInterpreter.networkName(dataType);

                  try {
                      SignalStrength ss = tm.getSignalStrength();
                      if (ss != null) s.level = ss.getLevel();
                  } catch (Exception e) { Log.w(TAG, "ss", e); }

                  try {
                      List<CellInfo> infos = tm.getAllCellInfo();
                      if (infos != null) {
                          for (CellInfo ci : infos) {
                              if (ci instanceof CellInfoLte && SignalInterpreter.isLte(dataType)) {
                                  CellInfoLte c = (CellInfoLte) ci;
                                  CellSignalStrengthLte sig = c.getCellSignalStrength();
                                  CellIdentityLte id = c.getCellIdentity();
                                  s.power = sig.getRsrp();
                                  s.quality = sig.getRsrq();
                                  s.sinr = sig.getRssnr();
                                  if (s.level == 0) s.level = sig.getLevel();
                                  if (id.getCi() != Integer.MAX_VALUE) s.cellId = id.getCi();
                                  if (id.getPci() != Integer.MAX_VALUE) s.pci = id.getPci();
                                  if (id.getTac() != Integer.MAX_VALUE) s.areaCode = id.getTac();
                                  if (id.getEarfcn() != Integer.MAX_VALUE) s.freqCode = id.getEarfcn();
                                  if (id.getMcc() != Integer.MAX_VALUE) s.mcc = id.getMcc();
                                  if (id.getMnc() != Integer.MAX_VALUE) s.mnc = id.getMnc();
                                  s.score = MainActivity.nativeLteScore(s.power, s.quality, s.sinr);
                                  s.grade = SignalInterpreter.lteRsrpGrade(s.power) + " / " + SignalInterpreter.lteRsrqGrade(s.quality);
                                  break;
                              } else if (ci instanceof CellInfoWcdma && SignalInterpreter.isWcdma(dataType)) {
                                  CellInfoWcdma c = (CellInfoWcdma) ci;
                                  CellSignalStrengthWcdma sig = c.getCellSignalStrength();
                                  CellIdentityWcdma id = c.getCellIdentity();
                                  s.power = sig.getDbm();
                                  s.quality = sig.getEcNo();
                                  s.sinr = 0;
                                  if (s.level == 0) s.level = sig.getLevel();
                                  if (id.getCid() != Integer.MAX_VALUE) s.cellId = id.getCid();
                                  if (id.getPsc() != Integer.MAX_VALUE) s.pci = id.getPsc();
                                  if (id.getLac() != Integer.MAX_VALUE) s.areaCode = id.getLac();
                                  if (id.getUarfcn() != Integer.MAX_VALUE) s.freqCode = id.getUarfcn();
                                  if (id.getMcc() != Integer.MAX_VALUE) s.mcc = id.getMcc();
                                  if (id.getMnc() != Integer.MAX_VALUE) s.mnc = id.getMnc();
                                  s.score = MainActivity.nativeWcdmaScore(s.power, s.quality);
                                  s.grade = SignalInterpreter.wcdmaDbmGrade(s.power) + " / " + SignalInterpreter.wcdmaEcnoGrade(s.quality);
                                  break;
                              } else if (ci instanceof CellInfoGsm && SignalInterpreter.isGsm(dataType)) {
                                  CellInfoGsm c = (CellInfoGsm) ci;
                                  CellSignalStrengthGsm sig = c.getCellSignalStrength();
                                  CellIdentityGsm id = c.getCellIdentity();
                                  s.power = sig.getDbm();
                                  s.quality = sig.getBitErrorRate();
                                  s.sinr = 0;
                                  if (s.level == 0) s.level = sig.getLevel();
                                  if (id.getCid() != Integer.MAX_VALUE) s.cellId = id.getCid();
                                  if (id.getBsic() != Integer.MAX_VALUE) s.pci = id.getBsic();
                                  if (id.getLac() != Integer.MAX_VALUE) s.areaCode = id.getLac();
                                  if (id.getArfcn() != Integer.MAX_VALUE) s.freqCode = id.getArfcn();
                                  if (id.getMcc() != Integer.MAX_VALUE) s.mcc = id.getMcc();
                                  if (id.getMnc() != Integer.MAX_VALUE) s.mnc = id.getMnc();
                                  s.score = 50;
                                  s.grade = SignalInterpreter.gsmDbmGrade(s.power);
                                  break;
                              }
                          }
                      }
                  } catch (Exception e) { Log.w(TAG, "cells", e); }

                  try {
                      long now = System.currentTimeMillis();
                      List<UsageStats> stats = usm.queryUsageStats(UsageStatsManager.INTERVAL_DAILY, now - 60000, now);
                      long latest = 0; String fg = "";
                      if (stats != null) for (UsageStats u : stats)
                          if (u.getLastTimeUsed() > latest) { latest = u.getLastTimeUsed(); fg = u.getPackageName(); }
                      s.fgApp = fg;
                  } catch (Exception e) { Log.w(TAG, "usage", e); }

                  try {
                      if (wm != null && wm.isWifiEnabled()) {
                          WifiInfo wi = wm.getConnectionInfo();
                          if (wi != null && wi.getRssi() < 0) {
                              s.wifiRssi = wi.getRssi(); s.wifiSsid = wi.getSSID();
                          }
                      }
                  } catch (Exception e) { Log.w(TAG, "wifi", e); }

                  db.insert(s);
              }

              @Override public int onStartCommand(Intent i, int f, int st) { return START_STICKY; }
              @Override public void onDestroy() { if (h != null && r != null) h.removeCallbacks(r); super.onDestroy(); }
              @Override public IBinder onBind(Intent i) { return null; }
          }
          EOF

          cat > app/src/main/java/com/example/signaldeep/MainActivity.java << 'EOF'
          package com.example.signaldeep;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.telephony.CellIdentityGsm;
          import android.telephony.CellIdentityLte;
          import android.telephony.CellIdentityWcdma;
          import android.telephony.CellInfo;
          import android.telephony.CellInfoGsm;
          import android.telephony.CellInfoLte;
          import android.telephony.CellInfoWcdma;
          import android.telephony.CellSignalStrengthGsm;
          import android.telephony.CellSignalStrengthLte;
          import android.telephony.CellSignalStrengthWcdma;
          import android.telephony.SignalStrength;
          import android.telephony.TelephonyManager;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              static {
                  System.loadLibrary("native-lib");
              }
              public native String stringFromNative();
              public static native int nativeLteScore(int rsrp, int rsrq, int sinr);
              public static native int nativeWcdmaScore(int dbm, int ecno);

              private TextView tvSignal;
              private TelephonyManager tm;
              private Handler handler = new Handler(Looper.getMainLooper());
              private Runnable poller = new Runnable() {
                  @Override public void run() { refresh(); handler.postDelayed(this, 3000); }
              };

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  tvSignal = findViewById(R.id.tv_signal);
                  tm = (TelephonyManager) getSystemService(TELEPHONY_SERVICE);

                  findViewById(R.id.btn_perms).setOnClickListener(v ->
                      ActivityCompat.requestPermissions(this, new String[]{
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.READ_PHONE_STATE,
                          Manifest.permission.ACCESS_WIFI_STATE,
                          Manifest.permission.CHANGE_WIFI_STATE
                      }, 100));

                  findViewById(R.id.btn_usage).setOnClickListener(v ->
                      startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)));

                  findViewById(R.id.btn_start).setOnClickListener(v -> {
                      try {
                          ContextCompat.startForegroundService(this,
                              new Intent(this, SignalSamplingService.class));
                          Toast.makeText(this, "Sampling started", Toast.LENGTH_SHORT).show();
                      } catch (Exception e) {
                          Toast.makeText(this, "Err: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      }
                  });

                  findViewById(R.id.btn_stop).setOnClickListener(v -> {
                      stopService(new Intent(this, SignalSamplingService.class));
                      Toast.makeText(this, "Stopped", Toast.LENGTH_SHORT).show();
                  });

                  findViewById(R.id.btn_history).setOnClickListener(v ->
                      startActivity(new Intent(this, CorrelationActivity.class)));
              }

              @Override protected void onResume() { super.onResume(); handler.post(poller); }
              @Override protected void onPause() { super.onPause(); handler.removeCallbacks(poller); }

              private void refresh() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("Native: ").append(stringFromNative()).append("\n\n");

                  int dataType = 0;
                  try {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_PHONE_STATE)
                              == PackageManager.PERMISSION_GRANTED) {
                          dataType = tm.getDataNetworkType();
                      } else {
                          sb.append("Grant READ_PHONE_STATE to detect network type.\n");
                      }
                  } catch (Exception e) { sb.append("Type error: ").append(e.getMessage()).append("\n"); }

                  sb.append("Active data: ").append(SignalInterpreter.networkName(dataType)).append("\n");

                  boolean hasLoc = ContextCompat.checkSelfPermission(this,
                      Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                  if (!hasLoc) { sb.append("Grant LOCATION permission first.\n"); tvSignal.setText(sb.toString()); return; }

                  SignalStrength ss = null;
                  try { ss = tm.getSignalStrength(); } catch (Exception ignored) {}
                  if (ss != null) {
                      int lvl = ss.getLevel();
                      sb.append("System level: ").append(lvl).append("/4 ").append(SignalInterpreter.bars(lvl)).append("\n");
                  }

                  List<CellInfo> infos = null;
                  try { infos = tm.getAllCellInfo(); } catch (Exception ignored) {}
                  if (infos == null || infos.isEmpty()) {
                      sb.append("No cell info available (Samsung often hides this).\n");
                      tvSignal.setText(sb.toString()); return;
                  }

                  for (CellInfo ci : infos) {
                      if (ci instanceof CellInfoLte && SignalInterpreter.isLte(dataType)) {
                          CellInfoLte c = (CellInfoLte) ci;
                          CellSignalStrengthLte sig = c.getCellSignalStrength();
                          CellIdentityLte id = c.getCellIdentity();
                          int rsrp = sig.getRsrp(), rsrq = sig.getRsrq(), sinr = sig.getRssnr();
                          int score = nativeLteScore(rsrp, rsrq, sinr);
                          sb.append("=== 4G LTE (serving) ===\n");
                          sb.append("RSRP: ").append(rsrp).append(" dBm → ").append(SignalInterpreter.lteRsrpGrade(rsrp)).append("\n");
                          sb.append("RSRQ: ").append(rsrq).append(" dB  → ").append(SignalInterpreter.lteRsrqGrade(rsrq)).append("\n");
                          sb.append("SINR: ").append(sinr).append("     → ").append(SignalInterpreter.lteSinrGrade(sinr)).append("\n");
                          sb.append("RSSI: ").append(sig.getRssi()).append(" dBm\n");
                          sb.append("CQI:  ").append(sig.getCqi()).append("\n");
                          sb.append("Level: ").append(sig.getLevel()).append("/4 ").append(SignalInterpreter.bars(sig.getLevel())).append("\n");
                          sb.append("--- Identity ---\n");
                          if (id.getCi() != Integer.MAX_VALUE) sb.append("CellID: ").append(id.getCi()).append("\n");
                          if (id.getPci() != Integer.MAX_VALUE) sb.append("PCI: ").append(id.getPci()).append("\n");
                          if (id.getTac() != Integer.MAX_VALUE) sb.append("TAC: ").append(id.getTac()).append("\n");
                          if (id.getEarfcn() != Integer.MAX_VALUE) sb.append("EARFCN: ").append(id.getEarfcn()).append("\n");
                          if (id.getMcc() != Integer.MAX_VALUE) sb.append("MCC/MNC: ").append(id.getMcc()).append("/").append(id.getMnc()).append("\n");
                          sb.append("--- Score ---\n");
                          sb.append("Quality: ").append(score).append("/100 → ").append(SignalInterpreter.scoreToGrade(score)).append("\n\n");
                      } else if (ci instanceof CellInfoWcdma && SignalInterpreter.isWcdma(dataType)) {
                          CellInfoWcdma c = (CellInfoWcdma) ci;
                          CellSignalStrengthWcdma sig = c.getCellSignalStrength();
                          CellIdentityWcdma id = c.getCellIdentity();
                          int dbm = sig.getDbm(), ecno = sig.getEcNo();
                          int score = nativeWcdmaScore(dbm, ecno);
                          sb.append("=== 3G WCDMA (serving) ===\n");
                          sb.append("RSCP/DBM: ").append(dbm).append(" dBm → ").append(SignalInterpreter.wcdmaDbmGrade(dbm)).append("\n");
                          sb.append("Ec/Io:    ").append(ecno).append(" dB  → ").append(SignalInterpreter.wcdmaEcnoGrade(ecno)).append("\n");
                          sb.append("Level: ").append(sig.getLevel()).append("/4 ").append(SignalInterpreter.bars(sig.getLevel())).append("\n");
                          sb.append("--- Identity ---\n");
                          if (id.getCid() != Integer.MAX_VALUE) sb.append("CellID: ").append(id.getCid()).append("\n");
                          if (id.getPsc() != Integer.MAX_VALUE) sb.append("PSC: ").append(id.getPsc()).append("\n");
                          if (id.getLac() != Integer.MAX_VALUE) sb.append("LAC: ").append(id.getLac()).append("\n");
                          if (id.getUarfcn() != Integer.MAX_VALUE) sb.append("UARFCN: ").append(id.getUarfcn()).append("\n");
                          if (id.getMcc() != Integer.MAX_VALUE) sb.append("MCC/MNC: ").append(id.getMcc()).append("/").append(id.getMnc()).append("\n");
                          sb.append("--- Score ---\n");
                          sb.append("Quality: ").append(score).append("/100 → ").append(SignalInterpreter.scoreToGrade(score)).append("\n\n");
                      } else if (ci instanceof CellInfoGsm && SignalInterpreter.isGsm(dataType)) {
                          CellInfoGsm c = (CellInfoGsm) ci;
                          CellSignalStrengthGsm sig = c.getCellSignalStrength();
                          CellIdentityGsm id = c.getCellIdentity();
                          int dbm = sig.getDbm();
                          sb.append("=== 2G GSM (serving) ===\n");
                          sb.append("RxLev: ").append(dbm).append(" dBm → ").append(SignalInterpreter.gsmDbmGrade(dbm)).append("\n");
                          sb.append("BER:   ").append(sig.getBitErrorRate()).append("\n");
                          sb.append("Level: ").append(sig.getLevel()).append("/4 ").append(SignalInterpreter.bars(sig.getLevel())).append("\n");
                          if (id.getCid() != Integer.MAX_VALUE) sb.append("CellID: ").append(id.getCid()).append("\n");
                          if (id.getLac() != Integer.MAX_VALUE) sb.append("LAC: ").append(id.getLac()).append("\n\n");
                      }
                  }
                  tvSignal.setText(sb.toString());
              }
          }
          EOF

