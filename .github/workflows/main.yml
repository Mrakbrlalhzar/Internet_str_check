          cat > app/src/main/java/com/example/signaldeep/BarChartView.java << 'EOF'
          package com.example.signaldeep;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.util.AttributeSet;
          import android.view.View;

          public class BarChartView extends View {
              private float[] values = new float[60]; // 60 bars = 6 seconds of history at 100ms
              private int[] colors = new int[60];
              private Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private Paint gridPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private Paint thresholdPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

              private float minY = 0, maxY = 100;
              private float threshGood = 75, threshFair = 40;

              public BarChartView(Context context, AttributeSet attrs) {
                  super(context, attrs);
                  for (int i = 0; i < values.length; i++) {
                      values[i] = minY;
                      colors[i] = 0xFF4CAF50;
                  }
                  gridPaint.setColor(0xFF333333);
                  gridPaint.setStrokeWidth(2f);
                  textPaint.setColor(0xFF888888);
                  textPaint.setTextSize(24f);
                  thresholdPaint.setStrokeWidth(2f);
              }

              public void setYRange(float min, float max) { this.minY = min; this.maxY = max; }
              public void setThresholds(float good, float fair) { this.threshGood = good; this.threshFair = fair; }

              public void addValue(float value, int color) {
                  for (int i = 0; i < values.length - 1; i++) {
                      values[i] = values[i + 1];
                      colors[i] = colors[i + 1];
                  }
                  values[values.length - 1] = Math.max(minY, Math.min(maxY, value));
                  colors[colors.length - 1] = color;
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  if (values.length == 0) return;

                  float width = getWidth();
                  float height = getHeight();
                  float paddingLeft = 60f;
                  float paddingBottom = 20f;
                  float chartWidth = width - paddingLeft;
                  float chartHeight = height - paddingBottom;

                  // Draw Y-axis labels and horizontal grid lines
                  textPaint.setTextAlign(Paint.Align.RIGHT);
                  float step = (maxY - minY) / 3f;
                  for (int i = 0; i <= 3; i++) {
                      float val = minY + (step * i);
                      float y = chartHeight - ((val - minY) / (maxY - minY) * chartHeight);
                      canvas.drawLine(paddingLeft, y, width, y, gridPaint);
                      canvas.drawText(String.valueOf((int)val), paddingLeft - 8, y + 8, textPaint);
                  }

                  // Draw Threshold Lines
                  thresholdPaint.setColor(0xFF4CAF50); // Green (Good)
                  float yGood = chartHeight - ((threshGood - minY) / (maxY - minY) * chartHeight);
                  if (yGood >= 0 && yGood <= chartHeight) {
                      canvas.drawLine(paddingLeft, yGood, width, yGood, thresholdPaint);
                  }

                  thresholdPaint.setColor(0xFFFF9800); // Orange (Fair)
                  float yFair = chartHeight - ((threshFair - minY) / (maxY - minY) * chartHeight);
                  if (yFair >= 0 && yFair <= chartHeight) {
                      canvas.drawLine(paddingLeft, yFair, width, yFair, thresholdPaint);
                  }

                  // Draw Bars
                  float barWidth = chartWidth / values.length;
                  for (int i = 0; i < values.length; i++) {
                      paint.setColor(colors[i]);
                      float left = paddingLeft + i * barWidth;
                      float right = left + barWidth - 1;
                      float val = values[i];
                      float top = chartHeight - ((val - minY) / (maxY - minY) * chartHeight);
                      canvas.drawRect(left, top, right, chartHeight, paint);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/signaldeep/OnboardingActivity.java << 'EOF'
          package com.example.signaldeep;

          import android.Manifest;
          import android.app.AppOpsManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Process;
          import android.provider.Settings;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.google.android.material.button.MaterialButton;
          import java.util.ArrayList;
          import java.util.List;

          public class OnboardingActivity extends AppCompatActivity {
              private static final int REQ_CODE = 100;
              private MaterialButton btnLetsGo;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  SharedPreferences prefs = getSharedPreferences("app_prefs", MODE_PRIVATE);
                  boolean isFirst = prefs.getBoolean("is_first_launch", true);

                  if (!isFirst && checkAllPermissions()) {
                      startActivity(new Intent(this, MainActivity.class));
                      finish();
                      return;
                  }

                  setContentView(R.layout.activity_onboarding);
                  btnLetsGo = findViewById(R.id.btn_lets_go);
                  btnLetsGo.setOnClickListener(v -> requestPermissions());
              }

              private boolean checkAllPermissions() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) return false;
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED) return false;
                  if (Build.VERSION.SDK_INT <= 28 && ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) return false;

                  AppOpsManager appOps = (AppOpsManager) getSystemService(Context.APP_OPS_SERVICE);
                  int mode = appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), getPackageName());
                  if (mode != AppOpsManager.MODE_ALLOWED) return false;

                  return true;
              }

              private void requestPermissions() {
                  List<String> perms = new ArrayList<>();
                  perms.add(Manifest.permission.ACCESS_FINE_LOCATION);
                  perms.add(Manifest.permission.READ_PHONE_STATE);
                  if (Build.VERSION.SDK_INT <= 28) {
                      perms.add(Manifest.permission.WRITE_EXTERNAL_STORAGE);
                  }
                  ActivityCompat.requestPermissions(this, perms.toArray(new String[0]), REQ_CODE);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_CODE) {
                      startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS));
                      proceed();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (btnLetsGo != null && btnLetsGo.isPressed()) {
                      proceed();
                  }
              }

              private void proceed() {
                  SharedPreferences prefs = getSharedPreferences("app_prefs", MODE_PRIVATE);
                  prefs.edit().putBoolean("is_first_launch", false).apply();
                  startActivity(new Intent(this, MainActivity.class));
                  finish();
              }
          }
          EOF

          cat > app/src/main/java/com/example/signaldeep/MainActivity.java << 'EOF'
          package com.example.signaldeep;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.telephony.CellInfo;
          import android.telephony.CellInfoLte;
          import android.telephony.CellSignalStrengthLte;
          import android.telephony.PhoneStateListener;
          import android.telephony.SignalStrength;
          import android.telephony.TelephonyManager;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.content.ContextCompat;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              private TelephonyManager tm;
              private PhoneStateListener phoneStateListener;

              private Handler handler = new Handler(Looper.getMainLooper());
              private TextView tvRsrpCur, tvRsrpMinMax, tvRsrpQual;
              private TextView tvRsrqCur, tvRsrqMinMax, tvRsrqQual;
              private TextView tvSinrCur, tvSinrMinMax, tvSinrQual;
              private TextView tvCqiCur, tvCqiMinMax, tvCqiQual;

              private BarChartView chartRsrp, chartRsrq, chartSinr, chartCqi;

              private int rawRsrp = -140, rawRsrq = -20, rawSinr = 0, rawCqi = 0;
              private int minRsrp = 0, maxRsrp = -140;
              private int minRsrq = 0, maxRsrq = -20;
              private int minSinr = 100, maxSinr = -100;
              private int minCqi = 15, maxCqi = 0;

              private final Runnable ticker = new Runnable() {
                  @Override public void run() {
                      fetchSignalData();
                      handler.postDelayed(this, 100);
                  }
              };

              private final Runnable textTicker = new Runnable() {
                  @Override public void run() {
                      updateStats();
                      handler.postDelayed(this, 500);
                  }
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  tm = (TelephonyManager) getSystemService(TELEPHONY_SERVICE);

                  tvRsrpCur = findViewById(R.id.tv_rsrp_current);
                  tvRsrpMinMax = findViewById(R.id.tv_rsrp_minmax);
                  tvRsrpQual = findViewById(R.id.tv_rsrp_quality);
                  tvRsrqCur = findViewById(R.id.tv_rsrq_current);
                  tvRsrqMinMax = findViewById(R.id.tv_rsrq_minmax);
                  tvRsrqQual = findViewById(R.id.tv_rsrq_quality);
                  tvSinrCur = findViewById(R.id.tv_sinr_current);
                  tvSinrMinMax = findViewById(R.id.tv_sinr_minmax);
                  tvSinrQual = findViewById(R.id.tv_sinr_quality);
                  tvCqiCur = findViewById(R.id.tv_cqi_current);
                  tvCqiMinMax = findViewById(R.id.tv_cqi_minmax);
                  tvCqiQual = findViewById(R.id.tv_cqi_quality);

                  chartRsrp = findViewById(R.id.chart_rsrp);
                  chartRsrq = findViewById(R.id.chart_rsrq);
                  chartSinr = findViewById(R.id.chart_sinr);
                  chartCqi = findViewById(R.id.chart_cqi);

                  // Set actual valid ranges for LTE parameters based on 3GPP / Android docs
                  chartRsrp.setYRange(-140, -43);
                  chartRsrp.setThresholds(-90, -105); // Green at -90, Orange at -105

                  chartRsrq.setYRange(-20, -3);
                  chartRsrq.setThresholds(-15, -20); // Green at -15, Orange at -20

                  chartSinr.setYRange(-20, 30);
                  chartSinr.setThresholds(13, 0); // Green at 13, Orange at 0

                  chartCqi.setYRange(0, 15);
                  chartCqi.setThresholds(10, 4); // Green at 10, Orange at 4

                  findViewById(R.id.btn_loginfo).setOnClickListener(v -> {
                      java.io.File f = SignalLogger.getFile();
                      String path = (f == null) ? "unavailable" : f.getAbsolutePath();
                      new androidx.appcompat.app.AlertDialog.Builder(this)
                          .setTitle("Log file").setMessage(path)
                          .setPositiveButton("OK", null).show();
                  });

                  phoneStateListener = new PhoneStateListener() {
                      @Override
                      public void onCellInfoChanged(List<CellInfo> cellInfo) {
                          super.onCellInfoChanged(cellInfo);
                          fetchSignalData();
                      }
                      @Override
                      public void onSignalStrengthsChanged(SignalStrength signalStrength) {
                          super.onSignalStrengthsChanged(signalStrength);
                          fetchSignalData();
                      }
                  };
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.READ_PHONE_STATE) == PackageManager.PERMISSION_GRANTED) {
                      tm.listen(phoneStateListener, PhoneStateListener.LISTEN_CELL_INFO | PhoneStateListener.LISTEN_SIGNAL_STRENGTHS);
                  }
                  handler.post(ticker);
                  handler.post(textTicker);
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  tm.listen(phoneStateListener, PhoneStateListener.LISTEN_NONE);
                  handler.removeCallbacks(ticker);
                  handler.removeCallbacks(textTicker);
                  SignalLogger.log("Main", "App went to background. Sampling stopped.");
              }

              private void fetchSignalData() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) return;
                  try {
                      List<CellInfo> infos = tm.getAllCellInfo();
                      if (infos != null) {
                          for (CellInfo ci : infos) {
                              if (ci instanceof CellInfoLte) {
                                  CellInfoLte c = (CellInfoLte) ci;
                                  CellSignalStrengthLte sig = c.getCellSignalStrength();
                                  rawRsrp = sig.getRsrp();
                                  rawRsrq = sig.getRsrq();
                                  rawSinr = sig.getRssnr();
                                  rawCqi = (Build.VERSION.SDK_INT >= 26) ? sig.getCqi() : 0;

                                  if (rawRsrp < minRsrp) minRsrp = rawRsrp;
                                  if (rawRsrp > maxRsrp) maxRsrp = rawRsrp;
                                  if (rawRsrq < minRsrq) minRsrq = rawRsrq;
                                  if (rawRsrq > maxRsrq) maxRsrq = rawRsrq;
                                  if (rawSinr < minSinr) minSinr = rawSinr;
                                  if (rawSinr > maxSinr) maxSinr = rawSinr;
                                  if (rawCqi < minCqi) minCqi = rawCqi;
                                  if (rawCqi > maxCqi) maxCqi = rawCqi;

                                  chartRsrp.addValue(rawRsrp, SignalInterpreter.colorForRsrp(rawRsrp));
                                  chartRsrq.addValue(rawRsrq, SignalInterpreter.colorForRsrq(rawRsrq));
                                  chartSinr.addValue(rawSinr, SignalInterpreter.colorForSinr(rawSinr));
                                  chartCqi.addValue(rawCqi, SignalInterpreter.colorForCqi(rawCqi));

                                  SignalLogger.debug("Sample", "RSRP=" + rawRsrp + " RSRQ=" + rawRsrq + " SINR=" + rawSinr + " CQI=" + rawCqi);
                                  break;
                              }
                          }
                      }
                  } catch (Throwable t) {
                      SignalLogger.debug("Sample", "Error: " + t);
                  }
              }

              private void updateStats() {
                  tvRsrpCur.setText("Current: " + rawRsrp + " dBm");
                  tvRsrpMinMax.setText("Min-Max: " + minRsrp + " / " + maxRsrp);
                  tvRsrpQual.setText("Quality: " + SignalInterpreter.lteRsrpGrade(rawRsrp));

                  tvRsrqCur.setText("Current: " + rawRsrq + " dB");
                  tvRsrqMinMax.setText("Min-Max: " + minRsrq + " / " + maxRsrq);
                  tvRsrqQual.setText("Quality: " + SignalInterpreter.lteRsrqGrade(rawRsrq));

                  tvSinrCur.setText("Current: " + rawSinr);
                  tvSinrMinMax.setText("Min-Max: " + minSinr + " / " + maxSinr);
                  tvSinrQual.setText("Quality: " + SignalInterpreter.lteSinrGrade(rawSinr));

                  tvCqiCur.setText("Current: " + rawCqi);
                  tvCqiMinMax.setText("Min-Max: " + minCqi + " / " + maxCqi);
                  tvCqiQual.setText("Quality: " + SignalInterpreter.lteCqiGrade(rawCqi));
              }
          }
          EOF

      - name: Verify all files present
        run: |
          set -e
          for f in \
            settings.gradle build.gradle gradle.properties .gitignore \
            app/build.gradle app/src/main/AndroidManifest.xml \
            app/src/main/res/values/colors.xml \
            app/src/main/res/drawable/card_outer.xml \
            app/src/main/res/drawable/chart_inner_bg.xml \
            app/src/main/res/drawable/stats_inner_bg.xml \
            app/src/main/res/layout/activity_onboarding.xml \
            app/src/main/res/layout/activity_main.xml \
            app/src/main/java/com/example/signaldeep/SignalLogger.java \
            app/src/main/java/com/example/signaldeep/SignalDeepApp.java \
            app/src/main/java/com/example/signaldeep/SignalInterpreter.java \
            app/src/main/java/com/example/signaldeep/BarChartView.java \
            app/src/main/java/com/example/signaldeep/OnboardingActivity.java \
            app/src/main/java/com/example/signaldeep/MainActivity.java ; do
            [ -f "$f" ] && echo "OK: $f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signal-deep-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and push generated files to repo
        if: success() && github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SignalDeep Bot"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "chore: auto-generate project files [skip ci]"
            git push
          fi
